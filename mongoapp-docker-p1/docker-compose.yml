services:
  chanchito:
    build: .
    ports:
      - "3000:3000"
    links:
      - monguito
  monguito:
    image: mongo:latest
    ports:
      - "127.0.0.1:27018:27017"
    environment:
     MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
     MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - monguito_data:/data/db
      # mysql_data:/var/lib/mysql
      # postgres_data:/var/lib/postgresql/data

volumes:
  monguito_data:
