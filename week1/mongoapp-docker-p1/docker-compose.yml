services:
  chanchito:
    build: .
    ports:
      - "3000:3000"
    links:
      - monguito
  monguito:
    image: mongo:latest
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: alan
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - monguito_data:/data/db
      # mysql_data:/var/lib/mysql
      # postgres_data:/var/lib/postgresql/data

volumes:
  monguito_data:
